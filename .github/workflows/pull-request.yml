name: Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  ai-review:
    name: AI Compliance Review
    runs-on: ubuntu-latest
    needs: lint
    environment: integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run AI compliance review
        run: npm run ai-review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload AI review report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-report
          path: ai-review-report.json
          retention-days: 7

      - name: Comment AI review results on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');

            let reportContent = '## 🤖 Przegląd Zgodności AI\n\n';

            if (fs.existsSync('ai-review-report.json')) {
              const report = JSON.parse(fs.readFileSync('ai-review-report.json', 'utf8'));

              reportContent += `**Ogólny Wynik: ${report.overallScore}%**\n\n`;
              reportContent += `### Podsumowanie\n`;
              reportContent += `- ✅ Przeszedł: ${report.summary.passed}\n`;
              reportContent += `- ⚠️ Ostrzeżenia: ${report.summary.warnings}\n`;
              reportContent += `- ❌ Nie przeszedł: ${report.summary.failed}\n\n`;

              if (report.results.filter(r => r.status === 'FAIL').length > 0) {
                reportContent += '### Nieudane Sprawdzenia\n';
                report.results.filter(r => r.status === 'FAIL').forEach(result => {
                  reportContent += `#### ${result.category}: ${result.criterion}\n`;
                  reportContent += `${result.message}\n\n`;
                  if (result.details) reportContent += `*${result.details}*\n\n`;
                  if (result.recommendation) reportContent += `💡 **Rekomendacja:** ${result.recommendation}\n\n`;
                });
              }

              if (report.results.filter(r => r.status === 'WARN').length > 0) {
                reportContent += '### Ostrzeżenia\n';
                report.results.filter(r => r.status === 'WARN').forEach(result => {
                  reportContent += `- ${result.category}: ${result.criterion} - ${result.message}\n`;
                  if (result.recommendation) reportContent += `  💡 ${result.recommendation}\n`;
                });
                reportContent += '\n';
              }

              if (report.overallScore >= 80) {
                reportContent += '🎉 **Projekt jest zgodny z wymaganiami przeglądu AI!**\n';
              } else {
                reportContent += '🚨 **Proszę rozwiązać powyższe problemy z zgodnością.**\n';
              }

            } else {
              reportContent += '❌ Przegląd AI nie mógł wygenerować raportu.\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('## 🤖 AI Compliance Review')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: reportContent
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: reportContent
              });
            }

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    environment: integration
    # Only run E2E tests for PRs from trusted sources
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install system fonts for consistent visual regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-color-emoji fonts-noto-cjk

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2E_USERNAME_ID: ${{ secrets.E2E_USERNAME_ID }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  status-comment:
    name: Status Comment
    runs-on: ubuntu-latest
    needs: [lint, unit-test, ai-review, e2e-test]
    if: always() && (needs.lint.result == 'success' && needs.unit-test.result == 'success' && needs.ai-review.result == 'success' && needs.e2e-test.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Generate status comment
        run: |
          echo "## ✅ All checks passed!" >> status.md
          echo "" >> status.md
          echo "### Test Results Summary" >> status.md
          echo "- **Linting**: ✅ Passed" >> status.md
          echo "- **Unit Tests**: ✅ Passed" >> status.md
          echo "- **AI Review**: ✅ Passed" >> status.md
          echo "- **E2E Tests**: ✅ Passed" >> status.md
          echo "" >> status.md

          # Add coverage info if available
          if [ -f "coverage/coverage-final.json" ]; then
            echo "### Coverage Report" >> status.md
            echo "\`\`\`" >> status.md
            npx istanbul report --include coverage/coverage-final.json text >> status.md 2>/dev/null || echo "Coverage report generation failed" >> status.md
            echo "\`\`\`" >> status.md
          fi

      - name: Post status comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const statusContent = fs.readFileSync('status.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('## ✅ All checks passed!')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: statusContent
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: statusContent
              });
            }
